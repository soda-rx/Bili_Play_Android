name: Release policy
on:
  push:
    branches: [main]
    tags: ['*']
  pull_request:
  release:
    types: [published, edited]
  workflow_dispatch:
    inputs:
      tag:
        description: 'Optional existing tag to check; leave empty to check source versions'
        required: false
        type: string

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.release.tag_name || inputs.tag || github.ref }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Test release guards with synthetic fixtures
        run: python -B -m unittest discover -s tools/tests -p "test_release.py" -v
      - name: Check source, tag and optional release event
        env:
          RELEASE_TAG: ${{ inputs.tag }}
        run: python -B tools/check_release.py --ci
